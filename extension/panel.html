<!doctype html>
<html><head><meta charset="utf-8"><title>Shortlist</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header>
  <img id="fav" alt=""><div class="page"><b id="ptitle">This page</b><span id="phost"></span></div>
  <button id="opts" class="ib" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></button>
</header>
<form id="ask">
  <svg class="ic" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
  <input id="q" placeholder="Sort this page by…" autocomplete="off" spellcheck="false">
  <button id="go" type="submit">Sort</button>
</form>
<div id="ideas"></div>
<div id="note" hidden></div>
<section id="status" hidden>
  <div class="line"><span class="spin"></span><svg class="ok" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.42L9 19 21 7l-1.41-1.41z"/></svg><b id="stage"></b></div>
  <div id="meta"></div>
  <div class="bar"><i id="prog"></i></div>
</section>
<ol id="list"></ol>
<script type="module" src="panel.js"></script>
</body></html>
